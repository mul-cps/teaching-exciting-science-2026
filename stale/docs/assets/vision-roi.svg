 x="1084" y="391" fill="#197F80" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Python receives</text><text x="1084" y="449" fill="#17354B" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" text-anchor="start">"red"</text><text x="1084" y="513" fill="#17354B" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">if red → left</text><text x="1084" y="557" fill="#17354B" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">if blue → right</text><text x="1084" y="600" fill="#17354B" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">otherwise → reject</text><text x="73" y="732" fill="#607383" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Not real detections; schematic view. Test thresholds with actual lighting.</text></svg>