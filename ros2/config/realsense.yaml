# Conservative D435i USB2 profile. RGB and aligned depth remain the source
# data; pointcloud is an additional visualization/consumer output.
enable_color: true
rgb_camera.color_profile: "640,480,15"
rgb_camera.color_format: RGB8
enable_depth: true
depth_module.depth_profile: "640,480,15"
depth_module.depth_format: Z16
enable_sync: true
align_depth.enable: true
pointcloud.enable: true
pointcloud.stream_filter: 2
pointcloud.stream_index_filter: 0
pointcloud.ordered_pc: false
publish_tf: true
enable_infra: false
enable_infra1: false
enable_infra2: false
enable_gyro: false
enable_accel: false
