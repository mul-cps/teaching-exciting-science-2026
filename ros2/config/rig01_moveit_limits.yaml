# Safety envelope for the station's real-body pose domain. These MoveIt bounds
# are a deliberately conservative planning envelope, not measured speed/effort
# capabilities or a replacement for hardware limits.
default_velocity_scaling_factor: 0.25
default_acceleration_scaling_factor: 0.25
joint_limits:
  shoulder_pan: &station_arm_limits
    has_position_limits: true
    min_position: -1.57079632679
    max_position: 1.57079632679
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.8
    has_jerk_limits: true
    max_jerk: 2.0
  shoulder_lift: *station_arm_limits
  # Pinned SO-ARM101 URDF elbow model bound; the owner still enforces its
  # narrower calibrated/configured/firmware raw intersection before execution.
  elbow_flex:
    <<: *station_arm_limits
    min_position: -1.69
    max_position: 1.69
  wrist_flex: *station_arm_limits
  wrist_roll: *station_arm_limits
  gripper:
    has_velocity_limits: true
    max_velocity: 0.3
    has_acceleration_limits: true
    max_acceleration: 0.5
    has_jerk_limits: true
    max_jerk: 1.0
