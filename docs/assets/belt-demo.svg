<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="760" viewBox="0 0 1620 760" role="img"><rect width="1620" height="760" fill="#F6FAFB"/><text x="60" y="77" fill="#197F80" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" text-anchor="start">MOVE → STOP</text><text x="60" y="123" fill="#607383" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">One safe advance brings the next block to a fixed pickup point.</text><rect x="100" y="275" width="1150" height="128" rx="44" fill="#DCE8EE" stroke="#91A6B2" stroke-width="5"/><rect x="115" y="292" width="1120" height="94" rx="35" fill="#A9BCCA" stroke="#8197A6" stroke-width="3"/><line x1="152.0" y1="305" x2="152.0" y2="373" stroke="#8DA1AF" stroke-width="3" stroke-linecap="round" /><line x1="327.83333333333337" y1="305" x2="327.83333333333337" y2="373" stroke="#8DA1AF" stroke-width="3" stroke-linecap="round" /><line x1="503.6666666666667" y1="305" x2="503.6666666666667" y2="373" stroke="#8DA1AF" stroke-width="3" stroke-linecap="round" /><line x1="679.5" y1="305" x2="679.5" y2="373" stroke="#8DA1AF" stroke-width="3" stroke-linecap="round" /><line x1="855.3333333333334" y1="305" x2="855.3333333333334" y2="373" stroke="#8DA1AF" stroke-width="3" stroke-linecap="round" /><line x1="1031.1666666666665" y1="305" x2="1031.1666666666665" y2="373" stroke="#8DA1AF" stroke-width="3" stroke-linecap="round" /><line x1="1207.0" y1="305" x2="1207.0" y2="373" stroke="#8DA1AF" stroke-width="3" stroke-linecap="round" /><circle cx="1238" cy="339" r="9" fill="#17354B"/><rect x="272" y="305" width="66" height="67" rx="12" fill="#DC6658" stroke="#FFFFFF" stroke-width="4"/><rect x="525" y="305" width="66" height="67" rx="12" fill="#609BD0" stroke="#FFFFFF" stroke-width="4"/><rect x="775" y="305" width="66" height="67" rx="12" fill="#DC6658" stroke="#FFFFFF" stroke-width="4"/><rect x="1065" y="300" width="66" height="67" rx="12" fill="#609BD0" stroke="#FFFFFF" stroke-width="4"/><line x1="1100" y1="241" x2="1100" y2="456" stroke="#197F80" stroke-width="4" stroke-linecap="round" stroke-dasharray="11 10"/><text x="1100" y="227" fill="#197F80" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">PICKUP</text><line x1="340" y1="477" x2="680" y2="477" stroke="#197F80" stroke-width="6" stroke-linecap="round" /><polygon points="680,477 665,467 665,487" fill="#197F80" transform="rotate(0.0,680,477)"/><text x="508" y="514" fill="#197F80" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">ADVANCE</text><rect x="1316" y="267" width="210" height="151" rx="20" fill="#E4EFF0" stroke="#B9D0D4" stroke-width="2"/><text x="1421" y="313" fill="#197F80" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">BELT</text><text x="1421" y="349" fill="#17354B" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">stop()</text><text x="60" y="626" fill="#17354B" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Why stop? A moving object is harder to grasp safely and repeatably.</text><text x="60" y="693" fill="#607383" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Diagram illustrates the logic; EV3 motor control is not yet bench validated.</text></svg>