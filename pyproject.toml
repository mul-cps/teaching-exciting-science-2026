[project]
name = "cps-candy-factory"
version = "0.1.0"
description = "A four-hour beginner CPS workshop; CPU-first and simulation-first"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
camera = ["opencv-python>=4.8,<5", "numpy>=1.26,<3"]
test = ["pytest>=8,<10", "numpy>=1.26,<3", "opencv-python-headless>=4.8,<5"]
materials = ["python-docx>=1.1,<2", "python-pptx>=1.0,<2", "Pillow>=10,<13", "cairosvg>=2.7,<3"]
gopro = ["open-gopro>=0.23,<1"]
ev3 = ["rpyc>=5,<7"]
station = [
  "lerobot[feetech]==0.6.1; python_version >= '3.12'",
  "pyusb==1.3.1",
  "feetech-servo-sdk==1.0.0; python_version >= '3.12'",
  "pyserial==3.5; python_version >= '3.12'",
  "deepdiff==8.6.2; python_version >= '3.12'",
  "torch==2.11.0+cpu; python_version >= '3.12'",
  "torchvision==0.26.0+cpu; python_version >= '3.12'",
]

digital-twin = ["mujoco==3.14.0", "viser==1.1.0", "numpy==2.4.6", "scipy==1.17.1", "Pillow==12.2.0", "trimesh==4.12.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["workshop*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"workshop.station" = ["resources/*.json", "resources/ev3_agent.py"]

"workshop.digital_twin" = ["assets/*.xml", "assets/*.urdf", "assets/*.json", "assets/SO-ARM100-LICENSE", "assets/cad/*.stl"]
